<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Votación Digital - Asamblea</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Chart.js para gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- QRCode.js (Librería ultra-fiable) -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-full bg-slate-100 text-slate-800 font-sans flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

  <!-- ENCABEZADO -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center shadow-md shadow-indigo-500/20">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </div>
        <div>
          <h1 class="font-bold text-base text-slate-900 leading-tight">Votación Digital</h1>
          <p class="text-xs text-slate-500">Sistema de Asamblea</p>
        </div>
      </div>

      <!-- Selector de Vista y Ajustes Supabase -->
      <div class="flex items-center space-x-2">
        <button onclick="toggleConfigModal()" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 transition flex items-center space-x-1.5">
          <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
          <span class="hidden sm:inline">Supabase</span>
        </button>

        <div class="bg-slate-200 p-1 rounded-xl flex space-x-1">
          <button id="btnRoleSecretary" onclick="setRole('secretary')" class="px-3 py-1 rounded-lg text-xs font-semibold transition bg-indigo-600 text-white shadow-sm">
            Secretario
          </button>
          <button id="btnRoleVoter" onclick="setRole('voter')" class="px-3 py-1 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition">
            Votante
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full">

    <!-- VISTA DEL SECRETARIO -->
    <div id="viewSecretary" class="space-y-6 block">
      
      <!-- Panel Superior: Estado y Controles -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Tarjeta del Punto a Votar -->
        <div class="lg:col-span-2 bg-white border border-slate-200 rounded-2xl p-6 flex flex-col justify-between shadow-sm">
          <div>
            <div class="flex items-center justify-between mb-4">
              <span class="text-xs font-bold tracking-wider text-indigo-600 uppercase bg-indigo-50 px-3 py-1 rounded-full border border-indigo-100">
                Punto Actual de la Asamblea
              </span>
              <div id="statusBadge" class="flex items-center space-x-2 text-xs font-semibold px-3 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="statusText">Votación Abierta</span>
              </div>
            </div>

            <!-- Entrada del Nombre del Punto -->
            <label class="block text-xs font-medium text-slate-600 mb-1">Título del Punto / Propuesta</label>
            <input type="text" id="pollTitleInput" oninput="updatePollTitle(this.value)" placeholder="Ej: Aprobación del presupuesto del ejercicio 2026" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-base font-semibold transition mb-4">

            <!-- Resumen de Contadores -->
            <div class="grid grid-cols-3 gap-3">
              <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-center">
                <div class="text-xs font-medium text-emerald-700 uppercase tracking-wider mb-1">SÍ</div>
                <div id="countYes" class="text-2xl font-extrabold text-emerald-800">0</div>
              </div>
              <div class="bg-rose-50 border border-rose-200 rounded-xl p-3 text-center">
                <div class="text-xs font-medium text-rose-700 uppercase tracking-wider mb-1">NO</div>
                <div id="countNo" class="text-2xl font-extrabold text-rose-800">0</div>
              </div>
              <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-center">
                <div class="text-xs font-medium text-amber-700 uppercase tracking-wider mb-1">Abstención</div>
                <div id="countAbs" class="text-2xl font-extrabold text-amber-800">0</div>
              </div>
            </div>
          </div>

          <!-- Acciones del Secretario -->
          <div class="mt-6 pt-4 border-t border-slate-100 flex flex-wrap gap-3">
            <button id="btnTogglePoll" onclick="togglePollStatus()" class="flex-1 px-4 py-2.5 rounded-xl text-sm font-bold bg-amber-500 hover:bg-amber-600 text-white transition flex items-center justify-center space-x-2 shadow-sm">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <span id="btnTogglePollText">Cerrar Votación</span>
            </button>

            <button onclick="resetPoll()" class="px-4 py-2.5 rounded-xl text-sm font-bold bg-indigo-600 hover:bg-indigo-700 text-white transition flex items-center justify-center space-x-2 shadow-sm">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-
